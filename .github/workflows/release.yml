name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Build binaries
      run: ./build.sh ${{ steps.get_version.outputs.VERSION }}
      
    - name: Generate checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        cd ..
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        release_name: Release ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## What's New
          
          * First stable release of crypto-cli
          * Complete cryptographic toolkit for learning and practice
          * Support for multiple platforms (Linux, macOS, Windows)
          
          ## Features
          
          - ✅ Random generation (PRNG): bytes, integers, UUIDs
          - ✅ Ciphers: encrypt and decrypt with AES (CBC mode)
          - ✅ Hashing: SHA-1, SHA-2, SHA-3
          - ✅ HMAC: keyed message authentication codes
          - ✅ Diffie-Hellman: key exchange
          - ✅ Key pairs: RSA and RSA-PSS key pair generation and serialization
          - ✅ Digital signatures: RSA sign and verify with SHA-256/SHA-512
          - ✅ Key derivation: KDFs like scrypt and PBKDF2
          
          ## Download
          
          Choose the appropriate binary for your platform:
          
          - **Linux (x64)**: `crypto-cli-${{ steps.get_version.outputs.VERSION }}-linux-amd64.tar.gz`
          - **Linux (ARM64)**: `crypto-cli-${{ steps.get_version.outputs.VERSION }}-linux-arm64.tar.gz`
          - **macOS (Intel)**: `crypto-cli-${{ steps.get_version.outputs.VERSION }}-darwin-amd64.tar.gz`
          - **macOS (Apple Silicon)**: `crypto-cli-${{ steps.get_version.outputs.VERSION }}-darwin-arm64.tar.gz`
          - **Windows (x64)**: `crypto-cli-${{ steps.get_version.outputs.VERSION }}-windows-amd64.zip`
          
          ## Installation
          
          1. Download the appropriate binary for your platform
          2. Extract the archive
          3. Move the binary to a directory in your PATH
          4. Run `crypto-cli --help` to get started
          
          ## Verification
          
          All binaries can be verified using the provided checksums in `checksums.txt`.
        draft: false
        prerelease: false
        
    - name: Upload Release Assets
      run: |
        for file in dist/*; do
          echo "Uploading $file"
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Content-Type: application/octet-stream" \
               --data-binary @"$file" \
               "${{ steps.create_release.outputs.upload_url }}?name=$(basename $file)"
        done
